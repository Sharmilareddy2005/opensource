<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <title>grant.it - Login</title>
</head>
<body>
    <div class="container">
        <h1 class="text-center text-success font-weight-bold">grant.it</h1>
        <div class="login-box">
            <select id="role" class="form-control mb-3">
                <option value="admin">Admin</option>
                <option value="coadmin">Co-admin</option>
                <option value="student">Student</option>
            </select>
            <input type="text" id="username" class="form-control mb-2" placeholder="Username" required>
            <input type="password" id="password" class="form-control mb-2" placeholder="Password" required>
            <button id="login-button" class="btn btn-primary btn-block">Login</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
